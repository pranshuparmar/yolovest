services:
  backend:
    build: ./backend
    container_name: yolovest-backend
    restart: unless-stopped
    expose:
      - "8080"
    volumes:
      - ./backend/config.yaml:/app/config.yaml:ro
      - yolovest-data:/app/data
      - yolovest-backups:/app/backups
      - yolovest-models:/app/models
      - yolovest-logs:/app/logs
    environment:
      - KITE_API_KEY=${KITE_API_KEY:-}
      - KITE_API_SECRET=${KITE_API_SECRET:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - TZ=Asia/Kolkata
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1536M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build: ./frontend
    container_name: yolovest-frontend
    restart: unless-stopped
    ports:
      - "${DASHBOARD_PORT:-7010}:80"
      - "${DASHBOARD_SSL_PORT:-7443}:443"
    volumes:
      # To enable HTTPS, generate certs and uncomment the next line:
      # - ./frontend/nginx-ssl.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

volumes:
  yolovest-data:
  yolovest-backups:
  yolovest-models:
  yolovest-logs:
