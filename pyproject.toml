[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yolovest"
version = "0.1.0"
description = "Fully autonomous AI-driven Indian stock trading platform"
requires-python = ">=3.11"
license = "MIT"
readme = "README.md"

dependencies = [
    "pydantic>=2.6,<3",
    "pyyaml>=6.0,<7",
    "aiosqlite>=0.20,<1",
    "aiohttp>=3.9,<4",
    "python-telegram-bot>=21.0,<22",
    "jugaad-data>=0.3,<1",
    "yfinance>=0.2,<1",
    "tvdatafeed @ git+https://github.com/rongardF/tvdatafeed.git",
    "pandas>=2.0,<3",
    "ta>=0.11,<1",
    "kiteconnect>=5.0,<6",
    "google-genai>=1.0,<2",
    "fastapi>=0.110,<1",
    "uvicorn>=0.27,<1",
    "websockets>=12.0,<17",
    "croniter>=2.0,<7",
    "feedparser>=6.0,<7",
    "httpx>=0.27,<1",
    "xgboost>=2.0,<3",
    "scikit-learn>=1.4,<2",
    "joblib>=1.3,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pytest-asyncio>=0.23,<1",
    "pytest-cov>=5.0,<6",
    "ruff>=0.3,<1",
    "mypy>=1.9,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/yolovest"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
target-version = "py311"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "ignore::UserWarning:jugaad_data.*",
]
