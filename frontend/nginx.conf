server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS, used together with a variable in proxy_pass
    # below so nginx re-resolves the backend hostname on each request
    # instead of caching the address from startup. Without this, a
    # backend container restart (which gets a new IP) makes every
    # subsequent /api request return 502 until the frontend is also
    # restarted.
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 256;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # HTTPS-only deployment (behind nginx-proxy) — tell browsers to refuse
    # plaintext for a year. No `preload` (a stronger, hard-to-undo commitment
    # that requires submission to the browser preload list).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # Baseline CSP. The Vite build emits only external scripts/styles so
    # script-src stays 'self'; style-src needs 'unsafe-inline' because recharts
    # and the dynamic bar-width styles set inline style attributes. Same-origin
    # /api + /ws are covered by connect-src 'self'. Verify in a browser after
    # deploy; relax a single directive only if a real resource breaks.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;

    # API requests → backend
    location /api/ {
        set $backend_upstream http://backend:8080;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Longer timeouts for slow skills (ingest-universe, model-retrain)
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # Stream large DB-backup / model downloads + uploads straight
        # through instead of spooling them to a temp file (default
        # proxy_max_temp_file_size is ~1 GB — a full DB backup hits the
        # ceiling and stalls). Disabling buffering streams byte-for-byte.
        proxy_buffering off;
        proxy_request_buffering off;
        # Allow multi-GB backup / model uploads (DB backups can be 1 GB+).
        client_max_body_size 4g;
    }

    # WebSocket → backend
    location /ws {
        set $backend_upstream http://backend:8080;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # Keep WebSocket alive
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Static assets with cache
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        # nginx only inherits server-level add_header directives into a
        # location that defines NONE of its own — the Cache-Control above
        # would otherwise drop every security header on asset responses, so
        # re-emit them here (nosniff in particular matters for JS/CSS).
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
