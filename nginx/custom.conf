# Custom nginx-proxy settings for YoloVest

# Increase timeouts for slow API calls (model-retrain, ingest-universe)
proxy_read_timeout 300s;
proxy_send_timeout 300s;
proxy_connect_timeout 10s;

# Allow large DB-backup / model transfers (full DB backups can be 1 GB+).
# Covers both the upload body and, with buffering off below, streamed
# downloads.
client_max_body_size 4g;

# Stream large downloads/uploads instead of spooling to a temp file
# (default proxy_max_temp_file_size ~1 GB stalls a full DB backup).
proxy_buffering off;
proxy_request_buffering off;
