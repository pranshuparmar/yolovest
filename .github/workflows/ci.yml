name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: every job here only checks out and runs read-only checks
# (lint / type / test / audit) — none push, comment, or release. A read-only
# default token means a compromised dependency in CI can't mutate the repo.
permissions:
  contents: read

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.dev.lock.txt
      - name: Install (locked)
        run: |
          pip install setuptools wheel
          pip install -r requirements.dev.lock.txt
          pip install --no-deps -e .
      - name: Lint (ruff)
        run: ruff check src/ tests/
      - name: Test (pytest + coverage gate)
        # Coverage floor is a ratchet below the current ~59% overall — it
        # guards against gross regression without flaking on small swings.
        # The core money modules (risk_check / trade_execute / position_monitor
        # / generate_signals / signal_evaluator / ml_signal / zerodha /
        # orchestrator) sit well above this floor; raise it as coverage grows.
        run: pytest tests/ -q --cov=yolovest --cov-report=term-missing --cov-fail-under=55

  backend-types:
    name: Backend (mypy)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.dev.lock.txt
      - name: Install (locked)
        run: |
          pip install setuptools wheel
          pip install -r requirements.dev.lock.txt
          pip install --no-deps -e .
      - name: Type-check (mypy)
        run: mypy src/

  frontend:
    name: Frontend (tsc + build + vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Type-check + build
        run: npm run build
      - name: Test (vitest)
        run: npm run test

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    # Blocking gate: a known CVE in the dependency tree fails CI. The single
    # transitively-pinned exception (autobahn via kiteconnect) is allow-listed
    # explicitly below via --ignore-vuln, so the gate stays green on packages
    # we can't unilaterally bump while still catching anything new. Add a
    # narrowly-scoped --ignore-vuln (with a comment) only for a genuinely
    # unfixable, justified advisory.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: pip-audit (backend runtime lock)
        # --ignore-vuln PYSEC-2020-25: autobahn 19.11.2 (redirect-header
        # injection) is hard-pinned by kiteconnect (autobahn[twisted]==19.11.2),
        # so it can't be bumped from our side, and autobahn here serves only the
        # authenticated Kite ticker WebSocket — not a web-facing surface. Drop
        # this ignore once kiteconnect relaxes its pin.
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.lock.txt --desc --ignore-vuln PYSEC-2020-25
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm audit (frontend, prod deps)
        run: npm --prefix frontend audit --omit=dev
