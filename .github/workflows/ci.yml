name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.dev.lock.txt
      - name: Install (locked)
        run: |
          pip install setuptools wheel
          pip install -r requirements.dev.lock.txt
          pip install --no-deps -e .
      - name: Lint (ruff)
        run: ruff check src/ tests/
      - name: Test (pytest + coverage gate)
        # Coverage floor is a ratchet below the current ~59% overall — it
        # guards against gross regression without flaking on small swings.
        # The core money modules (risk_check / trade_execute / position_monitor
        # / generate_signals / signal_evaluator / ml_signal / zerodha /
        # orchestrator) sit well above this floor; raise it as coverage grows.
        run: pytest tests/ -q --cov=yolovest --cov-report=term-missing --cov-fail-under=55

  backend-types:
    name: Backend (mypy)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.dev.lock.txt
      - name: Install (locked)
        run: |
          pip install setuptools wheel
          pip install -r requirements.dev.lock.txt
          pip install --no-deps -e .
      - name: Type-check (mypy)
        run: mypy src/

  frontend:
    name: Frontend (tsc + build + vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Type-check + build
        run: npm run build
      - name: Test (vitest)
        run: npm run test

  audit:
    name: Dependency audit (advisory)
    runs-on: ubuntu-latest
    # Advisory only: surfaces known CVEs in the dependency tree without
    # blocking merges. Some deps are pinned transitively (e.g. autobahn via
    # kiteconnect), so a hard gate would red-line CI on packages we can't
    # unilaterally bump. Review this job's log per run; promote to a blocking
    # gate (drop continue-on-error) once the tree is clean.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: pip-audit (backend runtime lock)
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.lock.txt --desc
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm audit (frontend, prod deps)
        run: npm --prefix frontend audit --omit=dev
