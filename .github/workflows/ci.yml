name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.dev.lock.txt
      - name: Install (locked)
        run: |
          pip install setuptools wheel
          pip install -r requirements.dev.lock.txt
          pip install --no-deps -e .
      - name: Lint (ruff)
        run: ruff check src/ tests/
      - name: Test (pytest + coverage gate)
        # Coverage floor is a ratchet below the current ~59% overall — it
        # guards against gross regression without flaking on small swings.
        # The core money modules (risk_check / trade_execute / position_monitor
        # / generate_signals / signal_evaluator / ml_signal / zerodha /
        # orchestrator) sit well above this floor; raise it as coverage grows.
        run: pytest tests/ -q --cov=yolovest --cov-report=term-missing --cov-fail-under=55

  backend-types:
    name: Backend (mypy)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.dev.lock.txt
      - name: Install (locked)
        run: |
          pip install setuptools wheel
          pip install -r requirements.dev.lock.txt
          pip install --no-deps -e .
      - name: Type-check (mypy)
        run: mypy src/

  frontend:
    name: Frontend (tsc + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Type-check + build
        run: npm run build
