name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.dev.lock.txt
      - name: Install (locked)
        run: |
          pip install setuptools wheel
          pip install -r requirements.dev.lock.txt
          pip install --no-deps -e .
      - name: Lint (ruff)
        run: ruff check src/ tests/
      - name: Test (pytest)
        run: pytest tests/ -q

  backend-types:
    name: Backend (mypy)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.dev.lock.txt
      - name: Install (locked)
        run: |
          pip install setuptools wheel
          pip install -r requirements.dev.lock.txt
          pip install --no-deps -e .
      - name: Type-check (mypy)
        run: mypy src/

  frontend:
    name: Frontend (tsc + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Type-check + build
        run: npm run build
