# YoloVest Configuration
#
# This file only contains settings that MUST come from a file:
# secrets, filesystem paths, and server binding.
#
# Everything else — including mode (paper/live), risk parameters, strategy,
# scanning, telegram toggle, log levels, etc. — is managed in the database
# and editable via the Settings page in the UI. On first start, code defaults
# are populated into the DB automatically.
#
# Copy this file to config.yaml and set environment variables for secrets.

broker:
  api_key: ${KITE_API_KEY}            # Zerodha Kite Connect API key (from environment)
  api_secret: ${KITE_API_SECRET}      # Zerodha Kite Connect API secret

llm:
  api_key: ${GEMINI_API_KEY}          # Google Gemini API key

# Filesystem paths — fixed by Docker volume mounts, no need to change
market_data:
  bhavcopy_dir: ./data/bhavcopy

database:
  path: ./data/yolovest.db
  backup_dir: ./backups

# Server binding — fixed by Docker EXPOSE / nginx proxy
dashboard:
  host: "0.0.0.0"
  port: 8080
  password: yolovest                  # basic auth password (change in production!)

# Log file paths/rotation — fixed by Docker volume mounts
log:
  log_dir: ./logs
  max_bytes: 10485760                 # 10 MB max per log file
  backup_count: 5                     # rotated log files to keep

# Telegram secrets only — enabled toggle is in Settings UI
notifications:
  telegram:
    bot_token: ${TELEGRAM_BOT_TOKEN}
    chat_id: ${TELEGRAM_CHAT_ID}
