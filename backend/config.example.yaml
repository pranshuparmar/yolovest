# YoloVest Configuration
#
# This file only contains settings that MUST come from a file:
# secrets, filesystem paths, server binding, and the paper/live mode switch.
#
# All other settings (risk, strategy, scanning, execution, etc.) are managed
# in the database and editable via the Settings page in the UI or the
# /holiday Telegram command. On first start, code defaults are populated
# into the DB automatically. You do NOT need to configure them here.
#
# Copy this file to config.yaml and set environment variables for secrets.

mode: paper  # paper | live — changing to live requires deliberate intent

broker:
  api_key: ${KITE_API_KEY}            # Zerodha Kite Connect API key (from environment)
  api_secret: ${KITE_API_SECRET}      # Zerodha Kite Connect API secret

llm:
  api_key: ${GEMINI_API_KEY}          # Google Gemini API key

market_data:
  bhavcopy_dir: ./data/bhavcopy       # path to downloaded NSE Bhavcopy CSVs

database:
  path: ./data/yolovest.db            # SQLite database file path
  backup_dir: ./backups               # backup directory (used by cron)

dashboard:
  host: "0.0.0.0"                     # bind address (requires restart to change)
  port: 8080                          # API port — nginx proxies to this in Docker
  password: yolovest                  # basic auth password (change in production!)

log:
  level: INFO                         # console log level (DEBUG, INFO, WARNING, ERROR)
  file_level: INFO                    # log file level (can be more verbose than console)
  log_dir: ./logs                     # log file directory
  max_bytes: 10485760                 # 10 MB max per log file
  backup_count: 5                     # number of rotated log files to keep

notifications:
  telegram:
    enabled: false                    # requires restart to toggle (starts/stops bot)
    bot_token: ${TELEGRAM_BOT_TOKEN}  # Telegram bot token
    chat_id: ${TELEGRAM_CHAT_ID}      # Telegram chat ID
