[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yolovest"
version = "0.1.0"
description = "Fully autonomous AI-driven Indian stock trading platform"
license = "Apache-2.0"
requires-python = ">=3.11"

dependencies = [
    "pydantic>=2.6,<3",
    "pyyaml>=6.0,<7",
    "aiosqlite>=0.20,<1",
    "aiohttp>=3.9,<4",
    "python-telegram-bot>=21.0,<22",
    "jugaad-data>=0.3,<1",
    "yfinance>=0.2,<1",
    # Pinned to a commit SHA: an unpinned git ref is both unreproducible and
    # a supply-chain hole (upstream force-push runs arbitrary code here).
    "tvdatafeed @ git+https://github.com/rongardF/tvdatafeed.git@e6f6aaa7de439ac6e454d9b26d2760ded8dc4923",
    "pandas>=2.0,<3",
    "kiteconnect>=5.0,<6",
    "google-genai>=1.0,<2",
    "fastapi>=0.110,<1",
    # Starlette is FastAPI's transitive ASGI core; pin a security floor here so
    # the lock can't resolve below the fix for CVE-2026-54282 (request.url host
    # injection) / CVE-2026-54283 (urlencoded form-parse DoS). FastAPI only
    # requires starlette>=0.46.0, so this is in-range.
    "starlette>=1.3.1",
    "python-multipart>=0.0.9,<1",
    "uvicorn>=0.27,<1",
    "websockets>=12.0,<17",
    "croniter>=2.0,<7",
    "feedparser>=6.0,<7",
    "httpx>=0.27,<1",
    "xgboost>=2.0,<3",
    "scikit-learn>=1.4,<2",
    "joblib>=1.3,<2",
    "vaderSentiment>=3.3,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pytest-asyncio>=0.23,<1",
    "pytest-cov>=5.0,<6",
    "ruff>=0.3,<1",
    "mypy>=1.9,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/yolovest"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
target-version = "py311"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
# Ignores below codify existing conventions rather than gut the gate:
# correctness families (F, E9, most of B/UP/RUF) stay fully enforced.
ignore = [
    "E501",   # line length — long log/SQL strings are pervasive house style
    "E402",   # deliberate lazy imports (startup cost / optional deps)
    "E741",   # short var names in tight math contexts
    "N806",   # X / y uppercase locals are ML convention
    "B008",   # FastAPI Depends()/Query() in defaults — framework pattern
    "B027",   # empty non-abstract hook methods on base classes
    "B905",   # zip(strict=) — call sites predate it
    "SIM102", # collapsible-if — nested ifs kept for comment clarity
    "SIM105", # try/except/pass vs contextlib.suppress — stylistic
    "SIM108", # ternary vs if/else — stylistic
    "SIM117", # nested with — kept for readability of response handling
    "UP031",  # printf-style formatting in a few log paths
    "RUF001", "RUF002", "RUF003",  # ₹ / — / × in strings and comments
    "RUF005", # list concat style
    "RUF012", # mutable class attrs — constants by convention here
    "RUF046", # int() cast style
]

[tool.ruff.lint.per-file-ignores]
# Tests routinely bind `result = await skill.execute(...)` purely to
# assert side effects, and loop over fixtures without using the index.
"tests/**" = ["F841", "B007", "RUF007", "RUF059"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
# Strict minus documented relaxations (the gate is enforced in CI):
# - no-any-return: most returns flow through untyped third-party SDKs
#   (kiteconnect, yfinance, pandas rows); strict flags every one.
disable_error_code = ["no-any-return"]

# Third-party SDKs without type stubs.
[[tool.mypy.overrides]]
module = [
    "croniter.*",
    "feedparser.*",
    "google.*",
    "joblib.*",
    "jugaad_data.*",
    "kiteconnect.*",
    "sklearn.*",
    "tvDatafeed.*",
    "vaderSentiment.*",
    "yaml.*",
    "yfinance.*",
]
ignore_missing_imports = true

# The Database class is composed from per-table mixins; every
# `self.conn` / cross-mixin method reference trips attr-defined and
# definition-order has-type inside the mixin modules. Structural to the
# pattern, not bugs — the composed class is exercised by 1,200+ tests.
[[tool.mypy.overrides]]
module = "yolovest.data.db.*"
disable_error_code = ["attr-defined", "has-type"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "ignore::UserWarning:jugaad_data.*",
]

# The evaluator's ml calls are guarded by its callers (generate-signals
# and dry-run never invoke it without a loaded model); the local
# Optional narrowing is left untouched to keep the signal hot path
# byte-identical. union-attr/has-type relaxed here only.
[[tool.mypy.overrides]]
module = "yolovest.strategy.signal_evaluator"
disable_error_code = ["union-attr", "has-type"]
